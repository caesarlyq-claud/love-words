<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学习数据后台</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#eef2ff;margin:0;color:#1f2937}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 12px #0001}.login{max-width:380px;margin:12vh auto}input,button,select{padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px}button{background:#4f46e5;color:#fff;border:0;cursor:pointer}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools input{flex:1;min-width:180px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee}th{color:#6b7280}.num{font-weight:700;color:#4f46e5}.muted{color:#9ca3af}.detail{max-width:360px;font-size:12px}.error{color:#dc2626}@media(max-width:700px){table{display:block;overflow:auto}.wrap{padding:12px}}</style><link rel="stylesheet" href="pk.css">
</head>
<body><div class="wrap"><div id="login" class="card login"><h2>梁老师管理后台</h2><p class="muted">查询所有学生的学习进度、错词与最近使用时间</p><input id="password" type="password" placeholder="管理员密码"><button onclick="loadData()">登录并查询</button><p id="error" class="error"></p></div>
<main id="main" hidden><div class="card"><h2>学生学习数据</h2><div class="tools"><input id="search" placeholder="搜索姓名、账号或班级" oninput="render()"><select id="book" onchange="render()"><option value="">全部词书</option></select><button onclick="loadData()">刷新</button><button onclick="exportCsv()">导出 CSV</button></div></div><div class="card"><p id="sync-feedback" role="status"></p><div id="summary"></div><div style="overflow:auto"><table><thead><tr><th>学生</th><th>班级</th><th>完成/学习单元</th><th>平均正确率</th><th>错词</th><th>奖杯</th><th>最后学习</th><th>详细进度</th></tr></thead><tbody id="rows"></tbody></table></div></div></main></div>
<script>var API=localStorage.getItem('love_words_api')||'https://vocab-progress.caesarlyq.workers.dev',data=[];var BOOKS={shanghai_2027:'2027上海考纲',toefl_junior:'小托福',nce1_upper:'新概念一上',nce1_lower:'新概念一下',nce1_irregular:'新概念一不规则动词',nce2_irregular:'新概念二不规则动词'};function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}async function loadData(){var p=document.getElementById('password').value||sessionStorage.getItem('admin_pwd');try{var r=await fetch(API+'/admin/students',{cache:'no-store',headers:{'X-Admin-Password':p}});if(!r.ok)throw Error('密码错误或同步服务尚未部署');data=(await r.json()).students||[];sessionStorage.setItem('admin_pwd',p);login.hidden=true;main.hidden=false;var ids=new Set;data.forEach(function(s){Object.keys((s.learning||{}).progress||{}).forEach(function(x){ids.add(x)})});book.innerHTML='<option value="">全部词书</option>'+[...ids].map(function(x){return'<option value="'+esc(x)+'">'+esc(BOOKS[x]||x)+'</option>'}).join('');render();document.getElementById('sync-feedback').textContent='已刷新云端记录：'+new Date().toLocaleString()+'。旧版记录需学生在原设备刷新网页、重新登录后补传。'}catch(e){error.textContent=e.message;document.getElementById('sync-feedback').textContent='刷新失败：'+e.message+'。当前表格可能是上次的记录。'}}function stats(s){var learning=s.learning||{},progress=learning.progress||{},filter=book.value,books=filter?{[filter]:progress[filter]||{}}:progress,units=[];Object.keys(books).forEach(function(id){Object.values(books[id]||{}).forEach(function(u){units.push(u)})});return{done:units.filter(function(u){return u.done}).length,started:units.length,avg:units.length?Math.round(units.reduce(function(n,u){return n+(Number(u.pct)||0)},0)/units.length):0,wrong:Object.keys(learning.wrongBank||learning.wrong_bank||{}).length,trophies:learning.trophies||0,last:learning.lastSeen||learning.last_seen,progress:books}}function render(){var q=search.value.trim().toLowerCase(),shown=data.filter(function(s){return(s.name+' '+s.account+' '+s.cls).toLowerCase().includes(q)});summary.textContent='共 '+shown.length+' 名学生';rows.innerHTML=shown.map(function(s){var x=stats(s),detail=Object.keys(x.progress).map(function(id){var us=x.progress[id]||{},done=Object.values(us).filter(function(u){return u.done}).length;return esc(BOOKS[id]||id)+' '+done+'/'+Object.keys(us).length}).join('；');return'<tr><td><b>'+esc(s.name)+'</b><br><span class="muted">'+esc(s.account)+'</span></td><td>'+esc(s.cls)+'</td><td class="num">'+x.done+' / '+x.started+'</td><td>'+x.avg+'%</td><td>'+x.wrong+'</td><td>'+x.trophies+'</td><td>'+esc(x.last?new Date(x.last).toLocaleString():'从未')+'</td><td class="detail">'+(detail||'暂无')+'</td></tr>'}).join('')}function exportCsv(){var lines=[['姓名','账号','班级','完成单元','学习单元','平均正确率','错词数','奖杯','最后学习']];data.forEach(function(s){var x=stats(s);lines.push([s.name,s.account,s.cls,x.done,x.started,x.avg+'%',x.wrong,x.trophies,x.last||''])});var csv='\ufeff'+lines.map(function(r){return r.map(function(v){return'"'+String(v||'').replace(/"/g,'""')+'"'}).join(',')}).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='学生学习数据.csv';a.click()}</script><script src="data/new-thinking.js"></script>
<script src="pk-core.js"></script>
<script src="pk-admin.js"></script>
</body></html>
